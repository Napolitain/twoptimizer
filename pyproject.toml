[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "napolitain.twoptimizer"
version = "1.1.0"
description = "Total War economic optimizers with CLI and interactive terminal UI"
authors = ["Maxime Boucher <mxboucher@gmail.com>"]
packages = [
    { include = "games" },
    { include = "twoptimizer" }
]

[tool.poetry.dependencies]
python = ">=3.12"
pulp = ">=2.7,<4"
ortools = ">=9.10,<10"
numpy = ">=2.0.2"
pyscipopt = ">=6,<7"
textual = ">=6,<7"

[tool.poetry.scripts]
twoptimizer = "twoptimizer.__main__:main"
