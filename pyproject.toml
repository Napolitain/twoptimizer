[project]
name = "napolitain-twoptimizer"
version = "1.2.0"
description = "Total War economic optimizers with CLI and interactive terminal UI"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maxime Boucher", email = "mxboucher@gmail.com" }]
dependencies = [
    "numpy>=2.0.2",
    "ortools>=9.10,<10",
    "pulp>=2.7,<4",
    "pyscipopt>=6,<7",
    "textual>=6,<7",
]

[project.scripts]
twoptimizer = "twoptimizer.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["games", "twoptimizer"]
module-root = ""
source-include = ["tests/**", "tools/**", "reports/**", "docs/**", "uv.lock", "AGENTS.md",
                  "prek.toml", "requirements.txt", ".python-version", ".editorconfig",
                  ".github/**", ".gitignore", "flake.nix", "flake.lock"]

[tool.ruff]
target-version = "py312"
line-length = 100
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests", "games/hoi4"]
addopts = ["-ra", "--strict-markers", "--cov", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.run]
source = ["games", "twoptimizer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 80

[tool.mutmut]
source_paths = ["games", "twoptimizer"]
also_copy = ["tools", "reports"]
do_not_mutate = ["games/**/test_*.py"]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
